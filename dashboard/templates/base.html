<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Email Bot{% endblock %} — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <style>
    [hx-indicator] { opacity: 1; transition: opacity 0.2s; }
    .htmx-request [hx-indicator] { opacity: 0.5; }
  </style>
</head>
<body class="h-full bg-gray-900 text-gray-100 flex">

  <!-- Sidebar -->
  <aside class="w-56 bg-gray-800 border-r border-gray-700 flex flex-col shrink-0">
    <div class="px-5 py-6 border-b border-gray-700">
      <span class="text-indigo-400 font-bold text-lg tracking-tight">📧 Email Bot</span>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1">
      <a href="/" class="nav-link {% block nav_overview %}{% endblock %}">
        <span class="mr-2">🏠</span> Overview
      </a>
      <a href="/companies" class="nav-link {% block nav_companies %}{% endblock %}">
        <span class="mr-2">🏢</span> Companies
      </a>
      <a href="/emails" class="nav-link {% block nav_emails %}{% endblock %}">
        <span class="mr-2">✉️</span> Emails
      </a>
      <a href="/pipeline" class="nav-link {% block nav_pipeline %}{% endblock %}">
        <span class="mr-2">⚙️</span> Pipeline
      </a>
    </nav>
    <div class="px-4 py-3 border-t border-gray-700 text-xs text-gray-500">
      v1.0 — Email Bot
    </div>
  </aside>

  <!-- Main content -->
  <main class="flex-1 overflow-y-auto">
    <div class="max-w-6xl mx-auto px-6 py-8">
      {% block content %}{% endblock %}
    </div>
  </main>

  <style>
    .nav-link {
      display: flex; align-items: center;
      padding: 0.5rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      color: #d1d5db;
      transition: background 0.15s;
    }
    .nav-link:hover { background: #374151; color: #f9fafb; }
    .nav-link.active { background: #4338ca; color: #fff; }
    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.15rem 0.55rem;
      border-radius: 9999px;
      font-size: 0.75rem; font-weight: 600;
    }
    .badge-green  { background: #166534; color: #86efac; }
    .badge-yellow { background: #713f12; color: #fde68a; }
    .badge-red    { background: #7f1d1d; color: #fca5a5; }
    .badge-gray   { background: #374151; color: #9ca3af; }
  </style>
</body>
</html>
